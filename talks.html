<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talks – Roozbeh Sarenche</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-Vz6y5kT8pFp3PcW2YgCQP7uOzJ9x+nIHuPu1fGZNeGg6o2TfZ4AkCHuMoRU8qmxQw+k1T2LnIE5sPQXIHvmiHQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="logo">Roozbeh&nbsp;Sarenche</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="publications.html">Publications</a></li>
                    <li><a href="talks.html">Talks</a></li>
                    <li><a href="blog.html">Blog</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section class="section alt-bg">
            <div class="container">
                <h2>Talks</h2>
                <p>This page lists selected talks and presentations. To add or edit entries, modify <code>assets/talks.js</code> in the repository.</p>
                <ul id="talks-list" class="research-list"></ul>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Roozbeh Sarenche. All rights reserved.</p>
        </div>
    </footer>
    <!-- Load talks data -->
    <script src="assets/talks.js"></script>
    <script>
    // Render talks defined in talks.js
    (function() {
        const list = document.getElementById('talks-list');
        if (typeof talks === 'undefined' || !Array.isArray(talks)) {
            list.innerHTML = '<li>Unable to load talks.</li>';
            return;
        }
        talks.sort((a, b) => new Date(b.date) - new Date(a.date));
        talks.forEach(talk => {
            const li = document.createElement('li');
            const date = new Date(talk.date).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
            const linkHtml = talk.link ? ' <a href="' + talk.link + '" target="_blank">[link]</a>' : '';
            li.innerHTML = '<strong>' + talk.title + '</strong><br>' + talk.event + ', ' + talk.location + ' (' + date + ')' + linkHtml;
            list.appendChild(li);
        });
    })();
    </script>
</body>
</html>
