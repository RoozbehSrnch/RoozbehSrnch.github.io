<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs – Roozbeh Sarenche</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-Vz6y5kT8pFp3PcW2YgCQP7uOzJ9x+nIHuPu1fGZNeGg6o2TfZ4AkCHuMoRU8qmxQw+k1T2LnIE5sPQXIHvmiHQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="logo">Roozbeh&nbsp;Sarenche</a>
                <ul class="nav-links">
                    <!-- Removed the Home entry; the logo already points home -->
                    <li><a href="publications.html">Publications</a></li>
                    <li><a href="talks.html">Talks</a></li>
                    <li><a href="blogs.html">Blogs</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section class="section">
            <div class="container">
                <h2>Blogs</h2>
                <!-- Blog entries are loaded from assets/blog.js -->
                <div id="blog-list"></div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Roozbeh Sarenche. All rights reserved.</p>
        </div>
    </footer>
    <!-- Load blog data -->
    <script src="assets/blog.js"></script>
    <script>
    // Render blog posts defined in blog.js
    (function() {
        const container = document.getElementById('blog-list');
        if (typeof blogPosts === 'undefined' || !Array.isArray(blogPosts)) {
            container.innerHTML = '<p>Unable to load blog posts.</p>';
            return;
        }
        blogPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
        blogPosts.forEach(post => {
            const div = document.createElement('div');
            div.style.marginBottom = '1.5rem';
            const dateStr = new Date(post.date).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
            const linkHtml = post.link && post.link !== '#' ? '<a href="' + post.link + '" target="_blank">Read more</a>' : '';
            div.innerHTML = '<h3>' + post.title + '</h3><p><em>' + dateStr + '</em></p><p>' + post.summary + '</p>' + linkHtml;
            container.appendChild(div);
        });
    })();
    </script>
</body>
</html>
